$kind: http-request
description: ""
url: "{{baseUrl}}/cart/{{demoProductId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "quantity": 999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400", () => pm.response.to.have.status(400));
      pm.test("Message: Only 3 units", () => pm.expect(pm.response.json().message).to.include("Only 3 units"));
    language: text/javascript
order: 8000
