$kind: http-request
description: "Bonus: one endpoint that adds or removes."
url: "{{baseUrl}}/wishlist/{{demoProductId}}/toggle"
method: PATCH
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("saved = false", () => pm.expect(pm.response.json().saved).to.eql(false));
    language: text/javascript
order: 6000
