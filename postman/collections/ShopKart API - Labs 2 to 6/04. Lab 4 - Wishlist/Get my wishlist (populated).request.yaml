$kind: http-request
description: ""
url: "{{baseUrl}}/wishlist"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const d = pm.response.json();
      const item = d.wishlist.find((p) => p._id === pm.collectionVariables.get("demoProductId"));
      pm.test("Saved product is listed", () => pm.expect(item).to.exist);
      pm.test("populate() returned product fields", () => pm.expect(item).to.include.keys("name", "price", "category", "image", "stock"));
      pm.test("count matches list", () => pm.expect(d.count).to.eql(d.wishlist.length));
    language: text/javascript
order: 3000
