$kind: http-request
description: ""
url: "{{baseUrl}}/customers/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Lab Six",
      "email": "{{email}}",
      "password": "secret123",
      "phone": "9876543210"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Registered", () => pm.response.to.have.status(201));
    language: text/javascript
  - type: beforeRequest
    code: |-
      pm.collectionVariables.set("email", `lab6_${Date.now()}@test.com`);
    language: text/javascript
order: 1000
