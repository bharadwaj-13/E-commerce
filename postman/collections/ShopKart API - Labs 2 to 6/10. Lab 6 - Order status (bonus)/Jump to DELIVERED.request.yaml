$kind: http-request
description: ""
url: "{{baseUrl}}/orders/{{paidOrderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "status": "DELIVERED"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("DELIVERED", () => pm.expect(pm.response.json().order.status).to.eql("DELIVERED"));
    language: text/javascript
order: 2000
