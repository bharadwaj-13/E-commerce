$kind: http-request
description: Empty body moves the order one step forward.
url: "{{baseUrl}}/orders/{{paidOrderId}}/status"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {}
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("CONFIRMED", () => pm.expect(pm.response.json().order.status).to.eql("CONFIRMED"));
    language: text/javascript
order: 1000
