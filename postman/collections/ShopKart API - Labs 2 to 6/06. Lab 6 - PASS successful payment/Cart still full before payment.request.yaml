$kind: http-request
description: "Lab 6 Test 3: creating the Razorpay order must not clear the cart."
url: "{{baseUrl}}/cart"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("Cart NOT cleared yet", () => pm.expect(pm.response.json().cart.length).to.be.above(0));
    language: text/javascript
order: 2000
