$kind: http-request
description: ""
url: "{{baseUrl}}/products/{{demoProductId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "price": 549
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("Price updated", () => pm.expect(pm.response.json().product.price).to.eql(549));
    language: text/javascript
order: 10000
