$kind: http-request
description: ""
url: "{{baseUrl}}/products?category=Books"
method: GET
queryParams:
  category: Books
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("Every product is in Books", () => pm.response.json().products.forEach((p) => pm.expect(p.category).to.eql("Books")));
    language: text/javascript
order: 3000
