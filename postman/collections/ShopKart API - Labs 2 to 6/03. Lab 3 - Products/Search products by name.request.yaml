$kind: http-request
description: ""
url: "{{baseUrl}}/products?search=key"
method: GET
queryParams:
  search: key
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      pm.test("Every name matches 'key' (case-insensitive)", () => pm.response.json().products.forEach((p) => pm.expect(p.name).to.match(/key/i)));
    language: text/javascript
order: 2000
