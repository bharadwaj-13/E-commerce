$kind: http-request
description: A verified payment can never be downgraded.
url: "{{baseUrl}}/orders/{{paidOrderId}}/payment-failed"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test("404", () => pm.response.to.have.status(404));
      pm.test("Message: Pending order not found", () => pm.expect(pm.response.json().message).to.include("Pending order not found"));
    language: text/javascript
order: 7000
