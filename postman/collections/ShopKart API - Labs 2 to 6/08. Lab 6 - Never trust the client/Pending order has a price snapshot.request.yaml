$kind: http-request
description: ""
url: "{{baseUrl}}/orders/{{shopKartOrderId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const o = pm.response.json().order;
      pm.test("paymentStatus PENDING", () => pm.expect(o.paymentStatus).to.eql("PENDING"));
      pm.test("status PENDING_PAYMENT", () => pm.expect(o.status).to.eql("PENDING_PAYMENT"));
      pm.test("Items store name, price, quantity, image", () => pm.expect(o.items[0]).to.include.keys("product", "name", "price", "quantity", "image"));
    language: text/javascript
order: 3000
