$kind: http-request
description: ""
url: "{{baseUrl}}/cart"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
      const total = pm.response.json().cart.reduce((sum, i) => sum + i.product.price * i.quantity, 0);
      pm.collectionVariables.set("expectedPaise", Math.round(total * 100));
    language: text/javascript
order: 1000
