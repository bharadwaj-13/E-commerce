$kind: http-request
name: Verify with mismatched Razorpay order id -> 400
description: ""
url: "{{baseUrl}}/orders/verify-payment"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "shopKartOrderId": "{{shopKartOrderId}}",
      "razorpay_order_id": "order_someone_elses",
      "razorpay_payment_id": "{{razorpay_payment_id}}",
      "razorpay_signature": "{{razorpay_signature}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Rejected", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
