$kind: http-request
description: ""
url: "{{baseUrl}}/cart"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      pm.test("Cart still has items", () => pm.expect(pm.response.json().cart.length).to.be.above(0));
    language: text/javascript
order: 8000
