$kind: http-request
description: ""
url: "{{baseUrl}}/orders/{{shopKartOrderId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("200 OK", () => pm.response.to.have.status(200));
      pm.test("paymentStatus FAILED", () => pm.expect(pm.response.json().order.paymentStatus).to.eql("FAILED"));
      pm.test("status still PENDING_PAYMENT", () => pm.expect(pm.response.json().order.status).to.eql("PENDING_PAYMENT"));
    language: text/javascript
order: 7000
