$kind: http-request
description: ""
url: "{{baseUrl}}/orders/create-payment-order"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "shippingAddress": {
        "fullName": "Test User",
        "phone": "9876543210",
        "addressLine1": "221B Baker Street",
        "city": "Bengaluru",
        "state": "Karnataka",
        "pincode": "560001"
      }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("201 Created", () => pm.response.to.have.status(201));
      const d = pm.response.json();
      pm.collectionVariables.set("shopKartOrderId", d.shopKartOrderId);
      pm.collectionVariables.set("razorpayOrderId", d.razorpayOrderId);
      pm.test("Razorpay order id returned", () => pm.expect(d.razorpayOrderId).to.match(/^order_/));
    language: text/javascript
order: 2000
