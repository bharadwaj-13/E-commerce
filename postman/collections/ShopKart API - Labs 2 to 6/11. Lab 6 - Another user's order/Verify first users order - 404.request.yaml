$kind: http-request
name: Verify first user's order - 404
description: ""
url: "{{baseUrl}}/orders/verify-payment"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "shopKartOrderId": "{{shopKartOrderId}}",
      "razorpay_order_id": "{{razorpayOrderId}}",
      "razorpay_payment_id": "pay_x",
      "razorpay_signature": "sig_x"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("404", () => pm.response.to.have.status(404));
    language: text/javascript
order: 6000
