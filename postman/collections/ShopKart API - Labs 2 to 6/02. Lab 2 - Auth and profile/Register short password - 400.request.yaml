$kind: http-request
description: ""
url: "{{baseUrl}}/customers/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "fullName": "Short",
      "email": "short_pw@test.com",
      "password": "123",
      "phone": "9876543210"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("400", () => pm.response.to.have.status(400));
      pm.test("Message: at least 6 characters", () => pm.expect(pm.response.json().message).to.include("at least 6 characters"));
    language: text/javascript
order: 5000
