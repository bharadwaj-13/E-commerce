$kind: http-request
description: "Still logged in: the JWT cookie stays valid after a password change."
url: "{{baseUrl}}/customers/change-password"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "oldPassword": "secret456",
      "newPassword": "secret123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 11000
