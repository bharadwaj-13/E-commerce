$kind: http-request
description: ""
url: "{{baseUrl}}/customers/change-password"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "oldPassword": "wrongpass",
      "newPassword": "secret456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 8000
